# Fourvision Web Apps - Azure Compiler Pipeline
name: GitHub-$(Date:yyyy-MM-dd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - master
  paths:
    include:
      - '**'
    exclude:
      - '*.yml'
      - '*.md'

jobs:
  - job: MergeToGithub
    displayName: 'Merge to Github (CareerSite)'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
        clean: true

      - task: PowerShell@2
        displayName: Update the GitHub mirror site
        name: updateGitHub
        env:
          AZURE_DEVOPS_CLI_PAT: $(System.AccessToken)
          GITHUB_PAT: $(GITHUB_PAT)  # Add your GitHub PAT as a secret variable in your pipeline
        inputs:
          targetType: 'inline'
          script: |
            Set-Location '$(Build.BinariesDirectory)'
            if (-Not (Test-Path '$(Build.BinariesDirectory)/GitHub-HRM-CareerSite')) {
              New-Item -Path '$(Build.BinariesDirectory)/GitHub-HRM-CareerSite' -ItemType Directory | Out-Null
            }

            # Init git
            git config --global user.email "support@fourvision.com"
            git config --global user.name "FourVision"
            git clone -b master "https://$(GITHUB_PAT)@github.com/FourVision/HRM.CareerSite.git" GitHub-HRM-CareerSite
            
            # Show all files and directories before deletion
            Write-Host "Files and directories before deletion:"
            Get-ChildItem -Path GitHub-HRM-CareerSite -Force -Recurse | ForEach-Object { Write-Host $_.FullName }

            # Clean content except .git and .github
            Get-ChildItem -Path GitHub-HRM-CareerSite -Force -Recurse | Where-Object {
              $_.FullName -notmatch '/\.git($|/)' -and
              $_.FullName -notmatch '/\.github($|/)'
            } | ForEach-Object {
              if ($_.PSIsContainer) {
                Remove-Item -Recurse -Force $_.FullName
              } else {
                Remove-Item -Force $_.FullName
              }
            }

            # Show all files and directories after deletion
            Write-Host "Files and directories after deletion:"
            Get-ChildItem -Path GitHub-HRM-CareerSite -Force -Recurse | ForEach-Object { Write-Host $_.FullName }

            # Copy all files recursively from $(Build.SourcesDirectory) to GitHub-HRM-CareerSite
            # Include dotfiles by using -Force; still exclude .git and .github
            Get-ChildItem -Path '$(Build.SourcesDirectory)' -Recurse -Force | Where-Object {
              $_.FullName -notmatch '/\.git($|/)' -and
              $_.FullName -notmatch '/\.github($|/)'
            } | ForEach-Object {
              $destinationPath = $_.FullName.Replace('$(Build.SourcesDirectory)', '$(Build.BinariesDirectory)/GitHub-HRM-CareerSite')
              if ($_.PSIsContainer) {
                New-Item -ItemType Directory -Path $destinationPath -Force | Out-Null
              } else {
                # Ensure parent directory exists
                $parent = Split-Path -Parent $destinationPath
                if (-not (Test-Path $parent)) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
                Copy-Item -Path $_.FullName -Destination $destinationPath -Force
              }
            }

            # Show all files and directories after copy
            Write-Host "Files and directories after copy:"
            Get-ChildItem -Path GitHub-HRM-CareerSite -Force -Recurse | ForEach-Object { Write-Host $_.FullName }

            # Add and commit version to remote GIT
            Set-Location '$(Build.BinariesDirectory)/GitHub-HRM-CareerSite'
            Write-Host "Adding and updating the GIT repo"
            git add -A
            git commit --allow-empty -m "Updated to $(Build.BuildNumber)"
            git push
          showWarnings: true